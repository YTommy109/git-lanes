{% extends "base.html" %}
{% block title %}{{ repo_name }} — グラフ{% endblock %}
{% block body %}
<div
  hx-ext="sse"
  sse-connect="/repos/{{ repo_id }}/events"
  hx-trigger="sse:reload"
  _="on sse:reload call window.location.reload()"
></div>
<div id="commit-tooltip"
     style="display:none;position:fixed;background:#222;color:#eee;padding:4px 10px;border-radius:4px;font-size:12px;pointer-events:none;z-index:1000;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
<main class="l--flex" style="height: 100%">
  <section class="-p:20 -ov:auto -bgc:white" aria-label="コミットグラフ"
           style="flex: 2; border-right: 1px solid var(--divider)">
    <header>
      <h1>{{ repo_name }}</h1>
    </header>
    {% if not nodes %}
      <p>コミットがありません。</p>
    {% else %}
      <svg
        id="graph-svg"
        tabindex="0"
        xmlns="http://www.w3.org/2000/svg"
        width="100%"
        height="{{ svg_height }}"
        viewBox="0 0 {{ svg_width }} {{ svg_height }}"
        role="img"
        aria-label="コミット履歴"
      >
        {# ブランチ名テキスト（複数ラベルを縦積み・45° 回転） #}
        {% for header in branch_headers %}
          {% for label_cy, label in header.label_entries %}
            <text
              transform="translate({{ header.cx }}, {{ label_cy - 14 }}) rotate(-45)"
              font-size="11"
              fill="{{ header.color }}"
              pointer-events="none"
            >{{ label.text }}</text>
          {% endfor %}
        {% endfor %}

        {# エッジ（コミット間の接続線） #}
        {% for edge in edges %}
          <path
            d="{{ edge.d }}"
            stroke="{{ edge.color }}"
            stroke-width="2"
            {% if edge.dashed %}stroke-dasharray="4,3"{% endif %}
            fill="none"
          />
        {% endfor %}

        {# ダミーマーカー（エッジより上・コミット円より下に描画） #}
        {% for header in branch_headers %}
          {% if header.connector_to_y %}
            <circle
              cx="{{ header.connector_to_x }}" cy="{{ header.connector_to_y }}"
              r="5"
              fill="white"
              stroke="{{ header.color }}"
              stroke-width="2"
            />
          {% endif %}
        {% endfor %}

        {# コミット円とラベル #}
        {% for node in nodes %}
          <g
            class="commit-node"
            data-lane="{{ node.lane }}"
            data-row="{{ node.row }}"
            data-msg="{{ node.commit.message.split('\n')[0] }}"
            hx-get="/repos/{{ repo_id }}/commits/{{ node.commit.hash }}/detail"
            hx-target="#commit-detail"
            hx-swap="innerHTML"
            _="on mouseenter set #commit-tooltip.textContent to my @data-msg
                             then set #commit-tooltip.style.display to 'block'
                             then set #commit-tooltip.style.top to (event.clientY - 36) + 'px'
                             then set #commit-tooltip.style.left to (event.clientX + 12) + 'px'
               on mouseleave set #commit-tooltip.style.display to 'none'
               on click remove .selected from .commit-node then add .selected to me"
          >
            {# ノード種別に応じた円の描画 #}
            {% if node.node_type in ("tip", "root") %}
              <circle cx="{{ node.cx }}" cy="{{ node.cy }}" r="9"
                      fill="none" stroke="{{ node.color }}" stroke-width="2.5"/>
            {% elif node.node_type == "merge" %}
              <circle cx="{{ node.cx }}" cy="{{ node.cy }}" r="7"
                      fill="none" stroke="{{ node.color }}" stroke-width="2.5"/>
            {% else %}
              <circle cx="{{ node.cx }}" cy="{{ node.cy }}" r="5"
                      fill="{{ node.color }}"/>
            {% endif %}
            {# バッジ形式のラベル（branch は省略、head と tag のみ表示） #}
            {% if node.labels %}
              {% set ns = namespace(x_offset=0) %}
              {% for label in node.labels %}
                {% if label.kind != "branch" %}
                  {% set badge_width = label.text | length * 7 + 8 %}
                  {% if label.kind == "head" %}
                    <rect x="{{ node.cx + 12 + ns.x_offset }}" y="{{ node.cy - 8 }}"
                          width="{{ badge_width }}" height="16"
                          rx="4" fill="{{ node.color }}" pointer-events="none"/>
                    <text x="{{ node.cx + 16 + ns.x_offset }}" y="{{ node.cy + 4 }}"
                          font-size="11" fill="white" font-weight="bold"
                          pointer-events="none">{{ label.text }}</text>
                  {% elif label.kind == "tag" %}
                    <rect x="{{ node.cx + 12 + ns.x_offset }}" y="{{ node.cy - 8 }}"
                          width="{{ badge_width }}" height="16"
                          rx="3" fill="none" stroke="#333333" stroke-width="1" pointer-events="none"/>
                    <text x="{{ node.cx + 16 + ns.x_offset }}" y="{{ node.cy + 4 }}"
                          font-size="10" font-family="monospace" fill="#333333" pointer-events="none">{{ label.text }}</text>
                  {% endif %}
                  {% set ns.x_offset = ns.x_offset + badge_width + 4 %}
                {% endif %}
              {% endfor %}
            {% endif %}
          </g>
        {% endfor %}
      </svg>
    {% endif %}
  </section>
  <aside class="-p:20 -bgc:base-2 -fx:1" style="min-width: 18rem" aria-label="コミット詳細">
    <h2>詳細</h2>
    <div id="commit-detail">
      <p class="-c:text-2">コミットを選択してください。</p>
    </div>
  </aside>
</main>
<script src="/static/js/graph-keyboard.js"></script>
{% endblock %}
