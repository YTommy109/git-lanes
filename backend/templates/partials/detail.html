<div class="commit-detail-body l--stack -g:10">
  <p><strong>ハッシュ</strong> {{ commit.hash }}</p>
  <p><strong>短縮</strong> {{ commit.short_hash }}</p>
  <p><strong>メッセージ</strong> {{ commit.message }}</p>
  <p><strong>作者</strong> {{ commit.author_name }} &lt;{{ commit.author_email }}&gt;</p>
  <p><strong>日時（UNIX）</strong> {{ commit.committed_at }}</p>
  {% if tags %}
  <p><strong>タグ</strong> {{ tags | join(", ") }}</p>
  {% endif %}
</div>
