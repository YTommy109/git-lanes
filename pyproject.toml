[project]
name = "git-lanes"
version = "0.4.6"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.46",
    "python-multipart>=0.0.26",
    "pygit2>=1.19",
    "watchdog>=6.0",
    "jinja2>=3.1",
    "sqlmodel>=0.0.38",
    "pywebview>=6.2",
    "httpx>=0.28",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-playwright",
    "playwright",
    "taskipy",
    "ruff",
    "ty",
    "pre-commit",
    "pyinstaller>=6.20.0",
    "bump-my-version",
]

[tool.taskipy.tasks]
dev         = "uvicorn backend.main:app --reload --port 8000"
test        = "pytest -v --cov --cov-report=term-missing"
"test:e2e"  = "pytest tests/e2e -v"
lint        = "ruff check ."
format      = "ruff format ."
typecheck   = "ty check"
"lint:md"   = "markdownlint-cli2 'docs/**/*.md' '*.md'"
migrate     = "atlas schema apply --url 'sqlite://${DB_PATH:-dev.db}' --to 'file://schema.hcl' --dev-url 'sqlite://dev?mode=memory'"
app         = "python -m backend.app"
build       = "pyinstaller -y git_lanes.spec"
"test:install" = "touch /tmp/git-lanes-test.dmg && GL_MOCK_FROZEN=1 GL_MOCK_DMG=/tmp/git-lanes-test.dmg uv run python -c 'from backend.services.update_installer import install_update; print(install_update())'"
"bump:patch" = "bump-my-version bump patch --no-commit --no-tag"
"bump:minor" = "bump-my-version bump minor --no-commit --no-tag"
"bump:major" = "bump-my-version bump major --no-commit --no-tag"
release      = "bash -c 'VERSION=$(bump-my-version show current_version) && git tag \"v$VERSION\" && echo \"Tagged: v$VERSION\"'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "C901", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ty.environment]
python-version = "3.12"

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85

[tool.bumpversion]
current_version = "0.4.6"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "git_lanes.spec"
search = '"CFBundleShortVersionString": "{current_version}"'
replace = '"CFBundleShortVersionString": "{new_version}"'

[[tool.bumpversion.files]]
filename = "backend/version.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
