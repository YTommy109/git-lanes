[project]
name = "git-lanes"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pygit2>=1.15",
    "watchdog>=4.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-playwright",
    "playwright",
    "taskipy",
    "ruff",
    "ty",
    "pre-commit",
    "httpx",
]

[tool.taskipy.tasks]
dev         = "uvicorn backend.main:app --reload --port 8000"
test        = "pytest -v"
"test:e2e"  = "pytest tests/e2e -v"
lint        = "ruff check ."
format      = "ruff format ."
typecheck   = "ty check"
migrate     = "atlas schema apply --url 'sqlite://${DB_PATH:-dev.db}' --to 'file://schema.hcl' --dev-url 'sqlite://dev?mode=memory'"
build       = "echo 'TODO: Electron build'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "C901", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ty.environment]
python-version = "3.12"

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
